<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff7fb">
    <meta name="description" content="오늘의 할 일을 기록하고 진행 상황을 확인해 보세요.">
    <title>갓생 렛츠고 | To-Do</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
  </head>
  <body class="min-h-screen bg-[#fff7fb] font-sans text-[#554b5b]">
    <div aria-hidden="true" class="pointer-events-none fixed -left-20 top-10 h-64 w-64 rounded-full bg-pink-200/50 blur-3xl"></div>
    <div aria-hidden="true" class="pointer-events-none fixed -right-24 bottom-0 h-80 w-80 rounded-full bg-emerald-100/70 blur-3xl"></div>

    <main class="relative mx-auto w-full max-w-2xl px-4 py-6 sm:px-6 sm:py-12">
      <section class="overflow-hidden rounded-[2rem] bg-white shadow-[0_18px_55px_rgba(132,92,125,0.12)]" aria-labelledby="app-title">
        <header class="bg-gradient-to-br from-[#ffe4ef] via-[#f8eafe] to-[#e6f7f0] px-5 py-8 sm:px-10 sm:py-12">
          <p class="mb-2 text-sm font-bold tracking-wide text-[#d86b9a]">오늘 할 일, 지금 바로 시작! ✨</p>
          <h1 id="app-title" class="text-3xl font-extrabold tracking-tight text-[#59485a] sm:text-4xl">갓생 렛츠고</h1>
          <p class="mb-6 mt-2 text-sm text-[#817383] sm:text-base">할 일을 하나씩 완료하며 오늘의 목표를 달성해요.</p>

          <div class="max-w-md rounded-2xl border border-white/80 bg-white/70 p-4 shadow-sm backdrop-blur">
            <div class="mb-2 flex items-center justify-between">
              <span class="text-sm text-[#817583]">오늘의 진행률</span>
              <span id="progress-text" class="font-extrabold text-[#d86b9a]">0%</span>
            </div>
            <div
              class="h-3 overflow-hidden rounded-full bg-[#f2eaf0]"
              role="progressbar"
              aria-label="전체 할 일 진행률"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0">
              <div id="progress-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-pink-300 via-violet-300 to-emerald-300 transition-[width] duration-300"></div>
            </div>
            <p id="task-count" class="mb-0 mt-2 text-xs text-[#817583]">완료 0개 · 전체 0개</p>
          </div>
        </header>

        <div class="px-5 pb-8 pt-6 sm:px-10 sm:pb-10">
          <form id="todo-form" class="flex gap-2.5" novalidate>
            <label class="sr-only" for="todo-input">새 할 일</label>
            <input
              id="todo-input"
              class="min-w-0 flex-1 rounded-2xl border border-[#eee3ed] bg-white px-4 py-3 text-sm text-[#554b5b] outline-none transition placeholder:text-[#b4aab6] focus:border-pink-300 focus:ring-4 focus:ring-pink-100"
              type="text"
              placeholder="새로운 할 일을 적어보세요"
              autocomplete="off"
              maxlength="1000"
              aria-describedby="form-message">
            <button
              class="shrink-0 rounded-2xl bg-[#f4a9c8] px-4 py-3 font-bold text-white shadow-md shadow-pink-100 transition hover:-translate-y-0.5 hover:bg-[#d86b9a] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pink-500 sm:px-6"
              type="submit">추가 <span aria-hidden="true">＋</span></button>
          </form>
          <p id="form-message" class="min-h-6 pt-1 text-sm text-[#bd4b73]" role="alert" aria-live="polite"></p>

          <div class="filter-list mb-5 mt-2 flex gap-1 rounded-2xl bg-[#faf6fa] p-1.5" role="group" aria-label="할 일 필터">
            <button class="flex-1 rounded-xl bg-white px-2 py-2.5 text-sm font-bold text-[#d86b9a] shadow-sm transition hover:bg-white/80" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="flex-1 rounded-xl px-2 py-2.5 text-sm font-bold text-[#918494] transition hover:bg-white/70 hover:text-[#d86b9a]" type="button" data-filter="active" aria-pressed="false">진행 중</button>
            <button class="flex-1 rounded-xl px-2 py-2.5 text-sm font-bold text-[#918494] transition hover:bg-white/70 hover:text-[#d86b9a]" type="button" data-filter="completed" aria-pressed="false">완료됨</button>
          </div>

          <ul id="todo-list" class="grid list-none gap-2.5 p-0" aria-label="할 일 목록"></ul>
          <div id="empty-state" class="py-8 text-center">
            <span class="mb-2 block text-4xl" aria-hidden="true">🌷</span>
            <p id="empty-message" class="mb-1 font-bold text-[#756778]">등록된 할 일이 없습니다</p>
            <p class="mb-0 text-sm text-[#9a909f]">오늘의 목표를 추가하고 갓생 시작!</p>
          </div>
        </div>
      </section>
      <p class="mb-0 mt-5 text-center text-sm text-[#988b9a]">오늘도 갓생, 렛츠고! 🚀</p>
    </main>
  </body>
</html>
